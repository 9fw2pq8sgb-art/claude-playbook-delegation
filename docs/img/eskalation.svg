<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" width="100%" role="img">
<style>
text{font-family:Futura, 'Century Gothic', 'Avenir Next', Arial, sans-serif;letter-spacing:0.04em}
.t{font-size:15px;font-weight:700;fill:#0A0A0A;text-anchor:middle}
.w{fill:#FFFFFF}
.s{font-size:13px;font-weight:700;fill:#6B7280}
.n{font-size:13px;fill:#374151;text-anchor:middle;letter-spacing:0.02em}
.hl{fill:none;stroke:#00C896;stroke-width:5;opacity:0}
.mk{animation:mk 10s linear infinite}@keyframes mk{0%{transform:translate(160px,282px);opacity:1}26%{transform:translate(160px,282px);opacity:1}29%{transform:translate(280px,190px);opacity:1}32%{transform:translate(400px,207px);opacity:1}54%{transform:translate(400px,207px);opacity:1}57%{transform:translate(520px,115px);opacity:1}60%{transform:translate(640px,132px);opacity:1}86%{transform:translate(640px,132px);opacity:1}91%{transform:translate(640px,132px);opacity:0}92%{transform:translate(160px,282px);opacity:0}96%{transform:translate(160px,282px);opacity:1}100%{transform:translate(160px,282px);opacity:1}}
.g1{animation:g1 10s linear infinite;opacity:0}@keyframes g1{0%,10%{opacity:0}12%,22%{opacity:1}24%,100%{opacity:0}}
.g2{animation:g2 10s linear infinite;opacity:0}@keyframes g2{0%,38%{opacity:0}40%,50%{opacity:1}52%,100%{opacity:0}}
.f3{animation:f3 10s linear infinite}@keyframes f3{0%,61%{opacity:0}63%,88%{opacity:1}92%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.mk{animation:none!important;transform:translate(640px,132px);opacity:1}.ring,.g1,.g2{animation:none!important;opacity:0}.f3{animation:none!important;opacity:1}}
</style>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<defs><marker id="pfeil" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#6B7280"/></marker><marker id="pfeil2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs>
<text class="t" x="400" y="52" style="font-size:19px">ERST PLAYBOOK SCHÄRFEN, DANN STUFE HÖHER</text>
<rect x="40" y="300" width="240" height="80" rx="0" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
<text class="t" x="160" y="335" style="font-size:17px">HAIKU 5.5</text>
<text x="160" y="358" style="font-size:13px;fill:#0A0A0A;text-anchor:middle;font-family:Futura, 'Century Gothic', 'Avenir Next', Arial, sans-serif;letter-spacing:0.04em">STUFE 1</text>
<rect x="280" y="225" width="240" height="155" rx="0" fill="#0D1F2D" stroke="#0D1F2D" stroke-width="2"/>

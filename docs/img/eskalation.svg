<circle class="mk" cx="0" cy="0" r="10" fill="#00C896" stroke="#0A0A0A" stroke-width="2"/>
<text class="s" x="40" y="412" style="fill:#374151">1. FAIL: PLAYBOOK SCHÄRFEN, GLEICHES MODELL, ZWEITER VERSUCH</text>
<text class="s" x="40" y="434" style="fill:#374151">2. FAIL: EINE STUFE HÖHER</text>

<text x="400" y="283" style="font-size:13px;fill:#FFFFFF;text-anchor:middle;font-family:Futura, 'Century Gothic', 'Avenir Next', Arial, sans-serif;letter-spacing:0.04em">STUFE 2</text>
<rect x="520" y="150" width="240" height="230" rx="0" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
<rect class="hl f3" x="522" y="152" width="236" height="226" rx="0"/>
<text class="t w" x="640" y="185" style="font-size:17px">OPUS SELBST</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" role="img">
<style>
text{font-family:Futura, 'Century Gothic', 'Avenir Next', Arial, sans-serif;letter-spacing:0.04em}
.t{font-size:15px;font-weight:700;fill:#0A0A0A;text-anchor:middle}
.w{fill:#FFFFFF}
.s{font-size:13px;font-weight:700;fill:#6B7280}
.n{font-size:13px;fill:#374151;text-anchor:middle;letter-spacing:0.02em}
.hl{fill:none;stroke:#00C896;stroke-width:5;opacity:0}
.dot{animation:dot 10s linear infinite;opacity:0}@keyframes dot{0%{transform:translate(400px,110px);opacity:0}1%{transform:translate(400px,110px);opacity:1}4%{transform:translate(400px,150px);opacity:1}11%{transform:translate(145px,150px);opacity:1}16%{transform:translate(145px,270px);opacity:1}27%{transform:translate(145px,270px);opacity:1}28%{transform:translate(145px,270px);opacity:0}30%{transform:translate(400px,110px);opacity:0}31%{transform:translate(400px,110px);opacity:1}40%{transform:translate(400px,270px);opacity:1}56%{transform:translate(400px,270px);opacity:1}58%{transform:translate(400px,270px);opacity:0}60%{transform:translate(400px,110px);opacity:0}61%{transform:translate(400px,110px);opacity:1}64%{transform:translate(400px,150px);opacity:1}71%{transform:translate(655px,150px);opacity:1}76%{transform:translate(655px,270px);opacity:1}87%{transform:translate(655px,270px);opacity:1}88%{transform:translate(655px,270px);opacity:0}100%{transform:translate(400px,110px);opacity:0}}
.r0{animation:r0 10s linear infinite}@keyframes r0{0%,15%{opacity:0}16%,28%{opacity:1}29%,100%{opacity:0}}
.r1{animation:r1 10s linear infinite}@keyframes r1{0%,39%{opacity:0}40%,58%{opacity:1}59%,100%{opacity:0}}
.r2{animation:r2 10s linear infinite}@keyframes r2{0%,75%{opacity:0}76%,88%{opacity:1}89%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.dot{animation:none!important;opacity:0}.hl{animation:none!important;opacity:1}}
</style>
